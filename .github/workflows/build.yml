// ==========================================
// 5. फ्लोटिंग बबल + 100+ भाषाएं + ₹10 मंथली सिस्टम
// ==========================================
class BubbleSubscriptionScreen extends StatefulWidget {
  const BubbleSubscriptionScreen({super.key});

  @override
  State<BubbleSubscriptionScreen> createState() => _BubbleSubscriptionScreenState();
}

class _BubbleSubscriptionScreenState extends State<BubbleSubscriptionScreen> {
  bool isPaidUser = false; // ₹10 पेमेंट स्टेटस
  int daysRemaining = 30; // 1 महीने की वैलिडिटी

  // 100+ भाषाओं में से यूजर की पसंद स्टोर करने के लिए वेरिएबल्स
  TranslateLanguage selectedSourceLang = TranslateLanguage.english;
  TranslateLanguage selectedTargetLang = TranslateLanguage.hindi;

  // भाषा का नाम दिखाने के लिए मैप या लिस्ट
  final Map<String, TranslateLanguage> supportedLanguages = {
    'English': TranslateLanguage.english,
    'Hindi (हिंदी)': TranslateLanguage.hindi,
    'Tamil (தமிழ்)': TranslateLanguage.tamil,
    'Urdu (اردو)': TranslateLanguage.urdu,
    'Spanish': TranslateLanguage.spanish,
    'French': TranslateLanguage.french,
    'Arabic': TranslateLanguage.arabic,
  };

  bool isModelReady = false;

  @override
  void initState() {
    super.initState();
    _initOfflineModel();
  }

  // भाषा का मॉडल डाउनलोड करने वाला इंजन
  void _initOfflineModel() async {
    final modelManager = OnDeviceTranslatorModelManager();
    bool downloaded = await modelManager.isModelDownloaded(selectedTargetLang.bcpCode);
    if (!downloaded) {
      await modelManager.downloadModel(selectedTargetLang.bcpCode);
    }
    setState(() {
      isModelReady = true;
    });
  }

  // सब्सक्रिप्शन और बबल एक्टिवेशन चेक
  void verifySubscriptionAndStartBubble() {
    if (daysRemaining > 0 && isPaidUser) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('TranslateX Bubble एक्टिव! (${supportedLanguages.keys.firstWhere((k) => supportedLanguages[k] == selectedTargetLang)} मोड)')),
      );
    } else {
      _showPaymentDialog();
    }
  }

  // ₹10 पेमेंट गेटवे पॉप-अप
  void _showPaymentDialog() {
    showDialog(
      context: context,
      builder: (context) => AlertDialog(
        backgroundColor: Colors.grey[900],
        title: const Text('TranslateX Pro Pass', style: TextStyle(color: Colors.white)),
        content: const Text(
          'फ्लोटिंग बबल और 100+ ऑफलाइन भाषाओं (तमिल, उर्दू, हिंदी आदि) का उपयोग करने के लिए मात्र ₹10 प्रति माह दें।',
          style: TextStyle(color: Colors.grey),
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(context),
            child: const Text('रद्द करें', style: TextStyle(color: Colors.grey)),
          ),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black),
            onPressed: () {
              setState(() {
                isPaidUser = true;
                daysRemaining = 30; // 30 दिन का पास एक्टिव
              });
              Navigator.pop(context);
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('भुगतान सफल! 1 महीने के लिए बबल चालू कर दिया गया है।')),
              );
            },
            child: const Text('₹10 भुगतान करें'),
          ),
        ],
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Padding(
      padding: const EdgeInsets.all(20.0),
      child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Icon(Icons.bubble_chart, size: 70, color: Colors.white),
          const SizedBox(height: 15),
          const Text(
            'यूनिवर्सल फ्लोटिंग बबल (100+ भाषाएं)',
            textAlign: TextAlign.center,
            style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white),
          ),
          const SizedBox(height: 15),

          // भाषा चुनने का ड्रॉपडाउन (Target Language Selection)
          Row(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              const Text('इसमें बदलें: ', style: TextStyle(color: Colors.grey)),
              const SizedBox(width: 10),
              DropdownButton<TranslateLanguage>(
                dropdownColor: Colors.grey[900],
                value: selectedTargetLang,
                items: supportedLanguages.entries.map((entry) {
                  return DropdownMenuItem(
                    value: entry.value,
                    child: Text(entry.key, style: const TextStyle(color: Colors.white)),
                  );
                }).formatDropdownValues ?? supportedLanguages.entries.map((entry) {
                  return DropdownMenuItem(
                    value: entry.value,
                    child: Text(entry.key, style: const TextStyle(color: Colors.white)),
                  );
                }).toList(),
                onChanged: (TranslateLanguage? newLang) {
                  if (newLang != null) {
                    setState(() {
                      selectedTargetLang = newLang;
                    });
                    _initOfflineModel(); // नई भाषा का मॉडल डाउनलोड करेगा
                  }
                },
              ),
            ],
          ),

          const SizedBox(height: 15),
          Text(
            isPaidUser 
              ? 'सब्सक्रिप्शन एक्टिव है! (शेष दिन: $daysRemaining दिन)' 
              : 'महीने का पास सक्रिय नहीं है।',
            style: TextStyle(color: isPaidUser ? Colors.greenAccent : Colors.redAccent),
          ),
          const SizedBox(height: 5),
          Text(
            isModelReady ? 'भाषा मॉडल: तैयार (ऑफ़लाइन)' : 'मॉडल डाउनलोड हो रहा है...',
            style: const TextStyle(color: Colors.grey, fontSize: 12),
          ),
          const SizedBox(height: 25),
          ElevatedButton(
            style: ElevatedButton.styleFrom(
              backgroundColor: Colors.white,
              foregroundColor: Colors.black,
              padding: const EdgeInsets.symmetric(horizontal: 30, vertical: 12),
            ),
            onPressed: verifySubscriptionAndStartBubble,
            child: const Text('फ्लोटिंग बबल चालू करें (₹10/माह)', style: TextStyle(fontWeight: FontWeight.bold)),
          ),
        ],
      ),
    );
  }
}

